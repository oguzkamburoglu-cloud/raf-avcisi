<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../www/fonts/fonts.css">
<style>
html,body{margin:0;background:transparent}
.c{width:1024px;height:1024px;position:relative;overflow:hidden}
.bg{background:#1F9D55}
.row{position:absolute;left:172px;width:680px;top:420px;height:226px;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.e{font-family:"Noto Color Emoji";line-height:1;font-size:180px;width:200px;text-align:center;display:block;overflow:visible}
</style></head><body>
<div class="c" id="c">
  <svg id="art" width="1024" height="1024" viewBox="0 0 1024 1024" style="position:absolute;inset:0">
    <!-- shelf card -->
    <rect x="172" y="300" width="680" height="430" rx="70" fill="#FBF5EC"/>
    <!-- plank -->
    <path d="M172 640h680v20a70 70 0 0 1 -70 70H242a70 70 0 0 1 -70 -70z" fill="#B3F1BE"/>
    <rect x="172" y="636" width="680" height="16" fill="#0A4521" opacity=".18"/>
    <!-- checkbox badge like PickyList logo -->
    <rect x="652" y="206" width="170" height="170" rx="40" fill="#fff" stroke="#1F9D55" stroke-width="0"/>
    <path d="M694 292l34 34 60 -70" stroke="#1F9D55" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="row"><span class="e">🍅</span><span class="e">🍅</span><span class="e">🍅</span></div>
</div>
<script>
const p=window.OPTS||{bg:1,scale:1};
const c=document.getElementById('c');
if(p.bg)c.classList.add('bg');
// Android adaptive icon foreground must fit the 66% safe zone: shrink the art around the centre
if(p.scale!==1){const w=document.createElement('div');w.style.cssText=`position:absolute;inset:0;transform:scale(${p.scale});transform-origin:512px 512px`;while(c.firstChild)w.appendChild(c.firstChild);c.appendChild(w)}
</script>
</body></html>
