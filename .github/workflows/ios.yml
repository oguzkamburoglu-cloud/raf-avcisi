name: iOS (App Store / TestFlight)

# Archives the iPhone app and uploads it to App Store Connect (it appears in TestFlight).
# Signing is automatic: Xcode creates the certificate and profile with an App Store Connect API key.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sürüm (ör. 1.0.1)"
        required: true
        default: "1.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync

      - name: App Store Connect API anahtarını yerleştir
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::ASC_KEY_P8 secret yok. MAGAZA_REHBERI.md › Otomatik derleme bölümüne bak."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          # Accept the .p8 as pasted: with or without the BEGIN/END lines, with Windows
          # line ends or literal \n, or base64 of the whole file. Prints only the shape, never the key.
          python3 - "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].strip().strip('"').replace("\\n", "\n").replace("\r", "")
          if "BEGIN" not in raw:
              try:
                  dec = base64.b64decode(re.sub(r"\s", "", raw)).decode()
                  if "BEGIN" in dec: raw = dec
              except Exception: pass
          body = re.sub(r"-----[A-Z ]+-----", "", raw)
          body = re.sub(r"\s", "", body)
          print(f"anahtar biçimi: BEGIN satırı {'var' if 'BEGIN' in raw else 'yok'}, {len(body)} karakter gövde")
          if not re.fullmatch(r"[A-Za-z0-9+/=]+", body) or len(body) < 100:
              sys.exit("::error::ASC_KEY_P8 bir .p8 dosyasının içeriği gibi görünmüyor. Dosyayı metin düzenleyiciyle açıp tamamını (BEGIN ve END satırları dahil) yapıştır.")
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          PY

      # Each archive makes Xcode create a new "Created via API" development certificate and Apple caps
      # how many an account holds, so remove the old throwaway ones first. Distribution is untouched.
      - name: Eski geçici geliştirme sertifikalarını temizle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages "pyjwt[crypto]" || pip3 install --quiet "pyjwt[crypto]"
          python3 scripts/asc-certs.py "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" --revoke

      - name: Arşivle ve App Store Connect'e yükle
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raf-avcisi-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
