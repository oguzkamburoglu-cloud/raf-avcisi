name: iOS derleme kontrolü

# Builds the iPhone app for the simulator without signing or uploading anything,
# so native changes (plugins, entitlements) are checked on every pull request.
on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/**", "plugins/**", "package.json", "package-lock.json", ".github/workflows/ios-check.yml"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci && npm run sync
      - name: Simülatör için derle
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
