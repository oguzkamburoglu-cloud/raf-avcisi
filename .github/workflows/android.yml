name: Android (Google Play)

# Builds a signed Android App Bundle (.aab) for Google Play.
# Manual: Actions › Android (Google Play) › Run workflow. Also runs on tags like v1.0.1.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sürüm adı (ör. 1.0.1)"
        required: true
        default: "1.0"
      play_track:
        description: "Play'e otomatik yükle (boş = yükleme). Ör: internal, alpha, production"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # GitHub runners already ship the Android SDK (ANDROID_HOME); Gradle fetches missing platforms

      - run: npm ci
      - run: npm run sync

      - name: İmza anahtarını yerleştir
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret yok: mağaza dosyası (AAB) yerine telefonda denemelik APK derleniyor. MAGAZA_REHBERI.md › 6. bölüm."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          PROPS

      - name: Denemelik APK derle (imza anahtarı yoksa)
        if: steps.sign.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed != 'true'
        with:
          name: raf-avcisi-deneme-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB derle
        if: steps.sign.outputs.signed == 'true'
        working-directory: android
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: raf-avcisi-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Google Play'e yükle (isteğe bağlı)
        if: ${{ steps.sign.outputs.signed == 'true' && github.event.inputs.play_track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.listeal.rafavcisi
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track }}
          status: draft
